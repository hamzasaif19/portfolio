<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Hamza Saif — Data Analyst, Dashboard Developer. Portfolio showcasing projects, experience, and skills." />
  <title>Hamza Saif | Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <!-- Loading Screen -->
  <div id="loading-screen">
    <div class="loader-content">
      <div class="loader-text" id="loader-text">INITIALIZING...</div>
      <div class="loader-bar-track"><div class="loader-bar-fill" id="loader-bar"></div></div>
      <div class="loader-status" id="loader-status">Loading modules...</div>
    </div>
  </div>

  <!-- Custom Cursor -->
  <div class="cursor-dot" id="cursor-dot"></div>
  <div class="cursor-ring" id="cursor-ring"></div>

  <!-- Scanline Overlay -->
  <div class="scanlines"></div>

  <!-- Navbar -->
  <nav id="navbar">
    <div class="nav-logo" id="nav-logo"></div>
    <button class="hamburger" id="hamburger" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links" id="nav-links">
      <li><a href="#hero" class="nav-link active" data-section="hero">Home</a></li>
      <li><a href="#about" class="nav-link" data-section="about">About</a></li>
      <li><a href="#skills" class="nav-link" data-section="skills">Skills</a></li>
      <li><a href="#experience" class="nav-link" data-section="experience">Experience</a></li>
      <li><a href="#projects" class="nav-link" data-section="projects">Projects</a></li>
      <li><a href="#achievements" class="nav-link" data-section="achievements">Achievements</a></li>
      <li><a href="#education" class="nav-link" data-section="education">Education</a></li>
      <li><a href="#contact" class="nav-link" data-section="contact">Contact</a></li>
    </ul>
  </nav>

  <!-- Hero Section -->
  <section id="hero" class="section">

    <div class="hero-content">
      <div class="hero-text">
        <div class="hero-greeting">WELCOME TO MY UNIVERSE</div>
        <h1 class="glitch" id="hero-name" data-text=""></h1>
        <div class="typewriter-wrap">
          <span class="typewriter-prefix">&gt; </span>
          <span class="typewriter-text" id="typewriter"></span>
          <span class="typewriter-cursor">|</span>
        </div>
        <div class="hero-cta">
          <a href="#projects" class="btn btn-primary" id="cta-projects">View Projects</a>
          <a href="#" class="btn btn-outline" id="cta-cv">Download CV</a>
        </div>
      </div>
      <div class="hero-avatar">
        <div class="avatar-orbit-container">
          <div class="avatar-ring"></div>
          <div class="avatar-glow"></div>
          <img id="avatar-img" src="" alt="Hamza Saif" />
          <div class="orbit-icon orbit-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12V7H5a2 2 0 010-4h14v4"/><path d="M3 5v14a2 2 0 002 2h16v-5"/><path d="M18 12a2 2 0 100 4 2 2 0 000-4z"/></svg></div>
          <div class="orbit-icon orbit-2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a8 8 0 018 8c0 6-8 12-8 12S4 16 4 10a8 8 0 018-8z"/><circle cx="12" cy="10" r="3"/></svg></div>
          <div class="orbit-icon orbit-3"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg></div>
        </div>
      </div>
    </div>
    <div class="scroll-indicator">
      <div class="scroll-line"></div>
      <span>SCROLL</span>
    </div>
  </section>

  <!-- About Section -->
  <section id="about" class="section">
    <div class="container">
      <h2 class="section-title"><span class="title-accent">//</span> ABOUT ME</h2>
      <div class="about-grid">
        <div class="about-text" id="about-text"></div>
        <div class="about-bars" id="about-bars"></div>
      </div>
    </div>
  </section>

  <!-- Skills Section -->
  <section id="skills" class="section">
    <div class="container">
      <h2 class="section-title"><span class="title-accent">//</span> SKILL MATRIX</h2>
      <div class="hex-grid" id="hex-grid"></div>
    </div>
  </section>

  <!-- Experience Section -->
  <section id="experience" class="section">
    <div class="container">
      <h2 class="section-title"><span class="title-accent">//</span> EXPERIENCE</h2>
      <div class="timeline" id="experience-timeline"></div>
    </div>
  </section>

  <!-- Projects Section -->
  <section id="projects" class="section">
    <div class="container">
      <h2 class="section-title"><span class="title-accent">//</span> PROJECTS</h2>
      <div class="projects-grid" id="projects-grid"></div>
    </div>
  </section>

  <!-- Project Modal -->
  <div class="modal-overlay" id="project-modal">
    <div class="modal-content" id="modal-content"></div>
    <button class="modal-close" id="modal-close">&times;</button>
  </div>

  <!-- Achievements Section -->
  <section id="achievements" class="section">
    <div class="container">
      <h2 class="section-title"><span class="title-accent">//</span> ACHIEVEMENTS</h2>
      <div class="achievements-grid" id="achievements-grid"></div>
    </div>
  </section>

  <!-- Education Section -->
  <section id="education" class="section">
    <div class="container">
      <h2 class="section-title"><span class="title-accent">//</span> EDUCATION</h2>
      <div class="timeline" id="education-timeline"></div>
    </div>
  </section>

  <!-- Contact Section -->
  <section id="contact" class="section">
    <div class="container">
      <h2 class="section-title"><span class="title-accent">//</span> CONTACT</h2>
      <div class="contact-panel" id="contact-panel"></div>
    </div>
  </section>

  <!-- Footer -->
  <footer id="footer">
    <p id="footer-text"></p>
  </footer>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="background.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
